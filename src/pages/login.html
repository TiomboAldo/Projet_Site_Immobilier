<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Said Africa</title>
    <link rel="icon" type="image/png" href="/src/assets/images/logo.jpeg">
    <link rel="stylesheet" href="../assets/icones/fontawesome/css/all.min.css">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->

</head>

<body>
    <a href="../../index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        <span>Retour à l'accueil</span>
    </a>

    <div class="wrapper">
        <div class="form-wrapper sign-up">
            <form id="formSignUp">
                <h2>S'inscrire</h2>
                <div class="input-group">
                    <input type="text" name="Nom" required>
                    <label>Nom</label>
                </div>
                <div class="input-group">
                    <input type="text" name="Prenom" required>
                    <label>Prenom</label>
                </div>
                <div class="input-group">
                    <input type="email" name="Email" required>
                    <label>E-mail</label>
                </div>
                <div class="input-group">
                    <input type="password" name="Password" required>
                    <label>Mot de passe</label>
                </div>
                <button type="submit" class="btn">S'inscrire</button>
                <div class="sign-link">
                    <p>Avez-vous déjà un compte ? <a href="#" class="signIn-link">Se connecter</a></p>
                </div>
            </form>
        </div>

        <div class="form-wrapper sign-in">
            <form id="formSignIn">
                <h2>Se connecter</h2>
                <div class="input-group">
                    <input type="text" name="Email" required>
                    <label>E-mail</label>
                </div>
                <div class="input-group">
                    <input type="password" name="Password" required>
                    <label>Mot de passe</label>
                </div>
                <div class="forgot-pass">
                    <a href="#">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn">Se connecter</button>
                <div class="sign-link">
                    <p>Vous n'avez pas de compte ? <a href="#" class="signUp-link">S'inscrire</a></p>
                </div>
            </form>
        </div>
    </div>

    <div id="infoModal">
        <div id="infoModalContent">
            <div id="infoIcon" style="font-size: 3rem;"></div>
            <h3 id="infoTitle" style="font-size: 1.3rem; font-weight: bold; margin-top: 10px;"></h3>
            <p id="infoMessage" style="color: #666; margin: 10px 0;"></p>

            <div id="loaderContainer">
                <div id="spinner" class="loader-spinner"></div>
                <p id="redirectText">Redirection en cours...</p>
            </div>

            <button id="modalBtn" onclick="closeInfoModal()" class="btn" style="margin-top: 15px;">
                Continuer
            </button>
        </div>
    </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(30, 58, 138, 0.9) 0%, transparent 70%);
            z-index: -1;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            z-index: 100;
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(33, 150, 243, 0.3);
            border-color: #2196f3;
        }

        .wrapper {
            position: relative;
            width: 400px;
            height: 550px;
            z-index: 1;
        }

        .form-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            transition: 0.5s;
        }

        .wrapper.animate-signUp .form-wrapper.sign-in {
            transform: rotate(7deg);
            animation: animateRotate .7s forwards;
        }

        .wrapper.animate-signIn .form-wrapper.sign-in {
            animation: animateSignIn 1.5s forwards;
        }

        @keyframes animateSignIn {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-500px);
            }

            100% {
                transform: translateX(0) rotate(7deg);
            }
        }

        .wrapper .form-wrapper.sign-up {
            transform: rotate(7deg);
        }

        .wrapper.animate-signIn .form-wrapper.sign-up {
            animation: animateRotate .7s forwards;
            animation-delay: .3s;
        }

        @keyframes animateRotate {
            100% {
                transform: rotate(0);
                z-index: 1;
            }
        }

        .wrapper.animate-signUp .form-wrapper.sign-up {
            animation: animateSignUp 1.5s forwards;
        }

        @keyframes animateSignUp {
            0% {
                transform: translateX(0);
                z-index: 1;
            }

            50% {
                transform: translateX(500px);
            }

            100% {
                transform: translateX(0) rotate(7deg);
            }
        }

        h2 {
            font-size: 30px;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            width: 320px;
            margin: 25px 0;
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: #fff;
            transition: 0.3s;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            height: 45px;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: #fff;
            padding: 0 15px;
            outline: none;
        }

        .input-group input:focus~label,
        .input-group input:valid~label {
            top: 0;
            font-size: 12px;
            background: #164a85;
            padding: 0 8px;
            border-radius: 4px;
            color: #2196f3;
        }

        .btn {
            width: 100%;
            height: 45px;
            background: #2196f3;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }

        .sign-link {
            color: #fff;
            margin-top: 20px;
            font-size: 14px;
        }

        .sign-link a {
            color: #2196f3;
            text-decoration: none;
            font-weight: 700;
        }

        .forgot-pass {
            width: 100%;
            text-align: right;
            margin: -10px 0 15px;
        }

        .forgot-pass a {
            color: #fff;
            font-size: 12px;
            text-decoration: none;
        }

        /* Cache le modal par défaut */
        #infoModal {
            display: none;
            /* C'est ça qui fait disparaître le bouton au début */
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Classe pour afficher le modal via JavaScript */
        #infoModal.active {
            display: flex;
            opacity: 1;
        }

        /* Style de la boîte blanche */
        #infoModalContent {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            width: 85%;
            /* Plus étroit sur mobile */
            max-width: 320px;
            /* Largeur max élégante */
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        /* Le Spinner Bleu */
        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            /* Bleu */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
            /* Caché par défaut */
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Texte de redirection */
        #redirectText {
            display: none;
            font-size: 0.9rem;
            color: #3498db;
            font-weight: 500;
            margin-top: 10px;
        }

        #infoModal.active #infoModalContent {
            transform: scale(1);
        }
    </style>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const signUpLink = document.querySelector('.signUp-link');
        const signInLink = document.querySelector('.signIn-link');

        signUpLink.onclick = () => { wrapper.classList.add('animate-signIn'); wrapper.classList.remove('animate-signUp'); };
        signInLink.onclick = () => { wrapper.classList.add('animate-signUp'); wrapper.classList.remove('animate-signIn'); };

        // SYSTÈME DE MODAL SANS CLIC OBLIGATOIRE
        function showMessage(title, message, type = 'success', autoClose = false) {
            const modal = document.getElementById('infoModal');
            const btn = document.getElementById('modalBtn');
            const iconDiv = document.getElementById('infoIcon');
            const spinner = document.getElementById('spinner');
            const redirectText = document.getElementById('redirectText');

            // Reset des affichages
            spinner.style.display = "none";
            redirectText.style.display = "none";
            btn.style.display = "block";

            document.getElementById('infoTitle').innerText = title;
            document.getElementById('infoMessage').innerText = message;

            // Icône FontAwesome
            iconDiv.innerHTML = (type === 'success')
                ? '<i class="fas fa-check-circle" style="color: #2ecc71;"></i>'
                : '<i class="fas fa-times-circle" style="color: #e74c3c;"></i>';

            // Affichage spécifique pour la redirection réussie
            if (autoClose) {
                btn.style.display = "none"; // On cache le bouton
                spinner.style.display = "block"; // On montre le spinner bleu
                redirectText.style.display = "block"; // On montre le texte "Redirection..."
            }

            modal.style.display = "flex";
            setTimeout(() => { modal.classList.add('active'); }, 10);

            if (autoClose) {
                setTimeout(() => {
                    closeInfoModal();
                }, 3000);
            }
        }

        function closeInfoModal() {
            const modal = document.getElementById('infoModal');
            modal.classList.remove('active');
        }
        // CONNEXION
        document.getElementById('formSignIn').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                Email: formData.get('Email'),
                Password: formData.get('Password')
            };

            try {
                const response = await fetch('http://localhost:5257/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userPrenom', result.user.prenom);
                    localStorage.setItem('userNom', result.user.nom);
                    localStorage.setItem('userEmail', result.user.email);
                    localStorage.setItem('userId', result.user.id);
                    localStorage.setItem('userRole', result.user.role || 'Client');
                    localStorage.setItem('jwtToken', result.token);

                    showMessage("Succès !", `Ravi de vous revoir ${result.user.prenom}.`, "success", true);
                    setTimeout(() => {
                        const pendingAction = localStorage.getItem('redirectAfterLogin');

                        if (pendingAction) {
                            localStorage.removeItem('redirectAfterLogin');
                            window.location.href = pendingAction;

                        } else {
                      
                            redirectUserByRole(result.user.role);
                        }
                    }, 2500);


                } else {

                    showMessage("Échec", result.message || "Identifiants incorrects", "error");
                }
            } catch (error) {
                showMessage("Erreur", "Le serveur ne répond pas. Vérifiez votre API C#.", "error");
            }
        };

        /**
         * Gère le routage automatique selon le profil utilisateur
         */
        function redirectUserByRole(role) {
            switch (role) {
                case 'Proprietaire':
                case 'UserIndep':
                    window.location.href = './espace_proprietaire.html';
                    break;
                case 'AdminRegion':
                case 'AdminPays':
                case 'DirecteurProjet':
                    window.location.href = './espace_admin_region.html';
                    break;
                case 'Client':
                default:
                    window.location.href = './accueil_user.html';
                    break;
            }
        }

        // INSCRIPTION
        document.getElementById('formSignUp').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('http://localhost:5257/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    showMessage("Bienvenue !", "Votre compte a été créé. Redirection vers la connexion...", "success", true);
                    setTimeout(() => signInLink.click(), 2500);
                } else {
                    showMessage("Erreur", result.message, "error");
                }
            } catch (error) {
                showMessage("Erreur", "Serveur injoignable.", "error");
            }
        };
    </script>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
