<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biens du propriétaire - Levetimmo</title>
    <link rel="icon" type="image/png" href="/src/assets/images/logo.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { box-sizing: border-box; }
        :root { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes popIn {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- TOPBAR -->
<div class="bg-white border-b border-gray-100 sticky top-0 z-10 px-4 md:px-10 h-16 flex items-center gap-4 shadow-sm">
    <a href="/src/pages/espace_admin_region.html#proprietaires"
       class="flex items-center gap-2 bg-blue-50 text-blue-700 text-sm font-bold px-4 py-2 rounded-xl hover:bg-blue-100 transition no-underline flex-shrink-0">
        <i class="fas fa-arrow-left"></i>
        <span class="hidden sm:inline">Retour</span>
    </a>
    <div class="min-w-0">
        <h1 class="text-sm md:text-base font-extrabold text-gray-900 truncate" id="pageTitle">Biens du propriétaire</h1>
        <p class="text-xs text-gray-500">Annonces publiées sur la plateforme</p>
    </div>
</div>

<div class="max-w-5xl mx-auto px-4 md:px-6 py-6 md:py-8">

    <!-- Header info (hidden until loaded) -->
    <div id="headerInfo"
         class="hidden bg-gradient-to-br from-blue-600 to-blue-800 rounded-3xl p-6 md:p-8 mb-8 shadow-xl">
        <div class="flex items-center gap-4 md:gap-6">
            <div id="avatarEl"
                 class="w-14 h-14 md:w-20 md:h-20 rounded-full bg-white/20 border-2 border-white/40 flex items-center justify-center text-xl md:text-3xl font-extrabold text-white flex-shrink-0">
            </div>
            <div class="min-w-0">
                <h2 id="nomProprietaire" class="text-xl md:text-2xl font-extrabold text-white truncate"></h2>
                <p id="regionProprietaire" class="text-blue-200 text-sm mt-1 flex items-center gap-1.5"></p>
                <p id="nbBiensLabel" class="text-blue-300 text-xs mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Spinner / content -->
    <div id="biensContainer" class="flex items-center justify-center py-20">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
    </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox"
     class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center cursor-zoom-out"
     onclick="this.classList.add('hidden'); this.classList.remove('flex')">
    <img id="lbImg" class="max-w-[92vw] max-h-[88vh] rounded-2xl object-contain shadow-2xl" src="" alt="">
    <button onclick="event.stopPropagation(); document.getElementById('lightbox').classList.add('hidden'); document.getElementById('lightbox').classList.remove('flex')"
            class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/20 text-white text-xl flex items-center justify-center hover:bg-white/30 transition border-none cursor-pointer font-bold">
        ×
    </button>
</div>

<script>
    const API = '/api';

    function getParams() {
        const p = new URLSearchParams(window.location.search);
        return { id: parseInt(p.get('id')), nom: p.get('nom') || 'Propriétaire' };
    }

    function escapeHtml(str = '') {
        return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
    }

    async function apiFetch(url) {
        const token = localStorage.getItem('jwtToken');
        try {
            const res = await fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                }
            });
            return await res.json();
        } catch (err) {
            return { success: false, message: 'Erreur réseau' };
        }
    }

    function formatPrix(prix) {
        const n = parseFloat(String(prix).replace(/\s/g, '').replace(',', '.'));
        if (!isNaN(n)) return n.toLocaleString('fr-FR') + ' FCFA';
        return prix;
    }

    function ouvrirPhoto(url) {
        const lb = document.getElementById('lightbox');
        document.getElementById('lbImg').src = url;
        lb.classList.remove('hidden');
        lb.classList.add('flex');
    }

    async function init() {
        const { id, nom } = getParams();

        const token = localStorage.getItem('jwtToken');
        const role  = localStorage.getItem('userRole');
        if (!token || !['AdminRegion','AdminPays','DirecteurProjet'].includes(role)) {
            window.location.href = '/src/pages/login.html';
            return;
        }

        document.getElementById('pageTitle').textContent = `Biens de ${nom}`;

        const res = await apiFetch(`${API}/biens/region`);
        if (!res.success) {
            document.getElementById('biensContainer').innerHTML =
                `<p class="text-red-500 font-semibold text-center py-10">Impossible de charger les biens.</p>`;
            return;
        }

        const biens = res.data.filter(b => b.proprietaireId === id);

        // En-tête propriétaire
        const initiales = nom.split(' ').map(s => s[0] || '').join('').toUpperCase().slice(0, 2);
        const firstBien = biens[0];
        document.getElementById('avatarEl').textContent = initiales;
        document.getElementById('nomProprietaire').textContent = nom;
        document.getElementById('regionProprietaire').innerHTML =
            `<i class="fas fa-map-marker-alt"></i>Région ${escapeHtml(firstBien?.region || '')}`;
        document.getElementById('nbBiensLabel').textContent =
            `${biens.length} annonce${biens.length !== 1 ? 's' : ''} au total`;
        const hdr = document.getElementById('headerInfo');
        hdr.classList.remove('hidden');
        hdr.classList.add('flex');

        const container = document.getElementById('biensContainer');

        if (!biens.length) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200 w-full">
                    <i class="fas fa-house text-5xl text-gray-300 mb-4"></i>
                    <p class="text-gray-400 font-bold text-lg">Aucun bien publié pour l'instant.</p>
                </div>`;
            return;
        }

        container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6';
        container.innerHTML = biens.map(b => {
            const isOff = !b.estDisponible;

            const badgeStatut = b.statut?.toLowerCase() === 'vente'
                ? `<span class="absolute top-3 left-3 bg-amber-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow">Vente</span>`
                : `<span class="absolute top-3 left-3 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow">Location</span>`;

            const badgeDispo = isOff
                ? `<span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">Désactivé</span>`
                : `<span class="absolute top-3 right-3 bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">Actif</span>`;

            const imageBlock = b.imageUrl
                ? `<img src="${escapeHtml(b.imageUrl)}" alt="${escapeHtml(b.titre)}"
                       onclick="ouvrirPhoto('${escapeHtml(b.imageUrl)}')"
                       class="w-full h-full object-cover transition duration-700 group-hover:scale-110 cursor-pointer${isOff ? ' grayscale opacity-70' : ''}">`
                : `<div class="w-full h-full bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center">
                       <i class="fas fa-house text-5xl text-blue-300"></i>
                   </div>`;

            const galerieHtml = (b.galerie && b.galerie.length)
                ? `<div class="flex gap-1.5 px-4 pt-3 pb-1 flex-wrap">
                    ${b.galerie.map((url, i) => `
                        <img src="${escapeHtml(url)}" alt="photo ${i+1}"
                             onclick="ouvrirPhoto('${escapeHtml(url)}')"
                             class="w-14 h-14 object-cover rounded-lg cursor-pointer hover:scale-105 transition duration-200 shadow-sm">`
                    ).join('')}
                   </div>`
                : '';

            return `
            <div class="group opacity-0 translate-y-10 transition-all duration-700 ease-out bg-white rounded-2xl shadow-xl overflow-hidden hover:-translate-y-2 hover:shadow-2xl">
                <div class="relative h-52 overflow-hidden">
                    ${imageBlock}
                    ${badgeStatut}
                    ${badgeDispo}
                </div>
                ${galerieHtml}
                <div class="p-5">
                    <h3 class="text-base font-extrabold text-gray-900 truncate mb-1">${escapeHtml(b.titre)}</h3>
                    <p class="text-sm text-gray-500 mb-2 flex items-center gap-1">
                        <i class="fas fa-map-marker-alt text-blue-600 text-xs flex-shrink-0"></i>
                        <span class="truncate">${escapeHtml(b.localisation)}</span>
                    </p>
                    <p class="text-lg font-extrabold text-blue-600 mb-3">${formatPrix(b.prix)}</p>
                    <div class="flex items-center justify-between text-xs text-gray-400 font-semibold border-t border-gray-100 pt-3">
                        <span><i class="fas fa-bed mr-0.5"></i> ${b.chambres} ch.</span>
                        <span><i class="fas fa-bath mr-0.5"></i> ${b.sallesDeBain} sdb</span>
                        <span><i class="fas fa-ruler-combined mr-0.5"></i> ${b.surface} m²</span>
                        <span><i class="fas fa-eye mr-0.5"></i> ${b.vues}</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Animation d'entrée décalée
        document.querySelectorAll('#biensContainer > div').forEach((card, i) => {
            setTimeout(() => {
                card.classList.remove('opacity-0', 'translate-y-10');
            }, i * 80);
        });
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            const lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
        }
    });

    init();
</script>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
